<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'sha256-q5gcghTsrNsiohNi+6vD5//g3ithMT1Q1PxvXvI2iQo='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob: https://pxxggnhgwzkgwwlrkymb.supabase.co; connect-src 'self' https://pxxggnhgwzkgwwlrkymb.supabase.co wss://pxxggnhgwzkgwwlrkymb.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bastille · La vidéo</title>
<meta name="description" content="Regarde cette partie de BASTILLE, le jeu satirique de la manif, et joue à ton tour.">
<meta property="og:title" content="BASTILLE — regarde cette partie">
<meta property="og:description" content="Black Bloc ou police : à toi de jouer, de la Bastille à la République.">
<meta name="theme-color" content="#1d1230">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800;900&family=Figtree:wght@400;700&display=swap">
<style>
:root{--ink:#1d1230;--paper:#fbf3e4;--coral:#ff5a4e;--sun:#ffb830;--mint:#2ee6b0;--cobalt:#2f5bff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--ink);color:var(--paper);font:16px/1.45 'Figtree',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;
  padding:24px max(16px,env(safe-area-inset-left,0px)) 32px max(16px,env(safe-area-inset-right,0px))}
main{width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
h1{font:900 34px 'Unbounded',system-ui,sans-serif;color:var(--sun);margin:0;letter-spacing:.02em}
video{width:100%;max-width:300px;aspect-ratio:9/16;border-radius:20px;border:4px solid var(--paper);box-shadow:8px 8px 0 var(--coral);background:#000;object-fit:cover}
.btn{display:inline-block;background:var(--sun);color:var(--ink);font:800 15px 'Unbounded',system-ui,sans-serif;padding:13px 20px;border-radius:14px;text-decoration:none;border:0;cursor:pointer;box-shadow:4px 4px 0 var(--paper)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.sm{font:700 13px 'Figtree',system-ui,sans-serif;padding:9px 13px;border-radius:10px;background:transparent;color:var(--paper);box-shadow:inset 0 0 0 2px var(--paper);text-decoration:none;cursor:pointer;border:0}
p{margin:0;color:#e5d9c6}
#err{color:var(--coral);font-weight:700}
</style>
</head>
<body>
<main>
  <h1>BASTILLE</h1>
  <p>Les 20 dernières secondes d'une partie. Tu fais mieux ?</p>
  <video id="v" controls playsinline loop muted autoplay></video>
  <p id="err" hidden>Cette vidéo n'est plus disponible.</p>
  <a class="btn" id="play" href="./">À TOI DE JOUER</a>
  <div class="row">
    <button class="sm" id="share" type="button" hidden>Partager</button>
    <a class="sm" id="x" target="_blank" rel="noopener">X</a>
    <a class="sm" id="fb" target="_blank" rel="noopener">Facebook</a>
    <a class="sm" id="wa" target="_blank" rel="noopener">WhatsApp</a>
    <button class="sm" id="copy" type="button">Copier le lien</button>
  </div>
</main>
<script src="config.js"></script>
<script>
(function(){
  const q=new URLSearchParams(location.search),v=q.get('v')||'',r=q.get('r')||'';
  const C=window.BT_CONFIG||{};
  const ok=/^[0-9a-f-]{36}\/[0-9a-f-]{36}\.(mp4|webm)$/i.test(v)&&C.url;
  const vid=document.getElementById('v');
  if(ok){vid.src=C.url.replace(/\/$/,'')+'/storage/v1/object/public/clips/'+v.split('/').map(encodeURIComponent).join('/');vid.onerror=()=>{vid.hidden=true;document.getElementById('err').hidden=false}}
  else{vid.hidden=true;document.getElementById('err').hidden=false}
  const base=location.origin+location.pathname.replace(/clip\.html$/,'');
  if(/^[a-z0-9]{4,16}$/i.test(r))document.getElementById('play').href=base+'?ref='+r;
  const url=location.href,txt='Regarde ma partie de BASTILLE, le jeu de la manif. À toi de jouer !',e=encodeURIComponent;
  document.getElementById('x').href='https://twitter.com/intent/tweet?text='+e(txt)+'&url='+e(url);
  document.getElementById('fb').href='https://www.facebook.com/sharer/sharer.php?u='+e(url);
  document.getElementById('wa').href='https://wa.me/?text='+e(txt+' '+url);
  const sh=document.getElementById('share');if(navigator.share){sh.hidden=false;sh.onclick=()=>navigator.share({title:'BASTILLE',text:txt,url}).catch(()=>{})}
  const cp=document.getElementById('copy');cp.onclick=async()=>{try{await navigator.clipboard.writeText(url);cp.textContent='Lien copié !'}catch(err){cp.textContent='Copiez l\'adresse de la page'}};
})();
</script>
</body>
</html>
